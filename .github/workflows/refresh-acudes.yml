# Reservoir volumes are the one layer that moves week to week. Everything else
# is a frozen snapshot refreshed by hand when an agency publishes.
name: Refresh reservoir volumes

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      # ANA publishes one reservoir per request and asserts no licence, so this
      # is deliberately slow and fails loudly rather than committing a blank.
      - name: Fetch volumes
        working-directory: pipeline
        run: uv run atlas acudes

      - name: Commit if the readings changed
        run: |
          if git diff --quiet -- app/public/data; then
            echo "No change in reservoir readings."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data
          git commit -m "Refresh reservoir volumes ($(date -u +%Y-%m-%d))"
          git push
